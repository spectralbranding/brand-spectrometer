name: Reproduce

# Repository-specific check, alongside the fleet ci.yml (which runs the Trivy
# scan). reproduce.sh is key-free and offline, and its outputs are deterministic,
# so CI re-runs it and fails if any committed output under data/ changes.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Offline reproduction and tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # preflight.py takes the concordance rule from prism_core, which ships
      # with the PRISM paper folders in sbt-papers (see code/preflight.py).
      - name: Checkout prism_core (sbt-papers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spectralbranding/sbt-papers
          path: _deps/sbt-papers
          sparse-checkout: prism-c-choice/code/prism_core

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Reproduce the headline numbers
        run: bash reproduce.sh

      - name: Outputs match the committed ones
        run: git diff --exit-code -- data/

      - name: Atlas validator tests
        run: uv run --with numpy --with pyyaml python code/tests/test_validate_atlas.py

      - name: Preflight tests
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/sbt-papers/prism-c-choice/code
        run: uv run --with numpy --with pyyaml python code/tests/test_preflight.py
